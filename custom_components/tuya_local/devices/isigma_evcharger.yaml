name: AC charging pile

products:
  - id: ppvclgmzvwgdyjxv
    manufacturer: Isigma

entities:
  - entity: switch
    name: Charging control
    icon: "mdi:ev-station"
    dps:
      - id: 124
        name: switch
        type: string
        optional: true
        mapping:
          - dps_val: "OpenCharging"
            value: true
          - dps_val: "CloseCharging"
            value: false
  - entity: number
    name: Charging current limit
    class: current
    category: config
    dps:
      - id: 115
        name: value
        type: integer
        optional: true
        unit: A
        range:
          min: 8
          max: 32
  - entity: number
    name: Delayed start
    icon: "mdi:timer-sand"
    category: config
    dps:
      - id: 118
        name: value
        type: integer
        optional: true
        range:
          min: 0
          max: 24
        unit: h
  - entity: number
    name: Maximum charging duration
    icon: "mdi:timer-stop"
    category: config
    dps:
      - id: 119
        name: value
        type: integer
        optional: true
        range:
          min: 0
          max: 24
        unit: h
  - entity: sensor
    name: Voltage
    class: voltage
    dps:
      - id: 102
        name: sensor
        type: integer
        optional: true
        unit: V
        class: measurement
  - entity: sensor
    name: Charging current
    class: current
    dps:
      - id: 105
        name: sensor
        type: integer
        optional: true
        unit: A
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    name: Charging power
    class: power
    dps:
      - id: 109
        name: sensor
        type: integer
        optional: true
        unit: kW
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    name: Charging energy
    class: energy
    dps:
      - id: 112
        name: sensor
        type: integer
        optional: true
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 10
  - entity: sensor
    name: Temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 110
        name: sensor
        type: integer
        optional: true
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    class: enum
    translation_key: status
    icon: "mdi:ev-station"
    dps:
      - id: 101
        type: string
        name: sensor
        mapping:
          - dps_val: no_connet
            value: available
          - dps_val: connect
            value: plugged_in
          - dps_val: charing
            value: charging
          - dps_val: wait_rfid
            value: waiting_for_authorization
          - dps_val: finish
            value: charged
          - dps_val: wait_charing
            value: waiting
          - dps_val: error
            value: fault
      - id: 3
        type: string
        optional: true
        name: charger_status
      - id: 11
        type: string
        optional: true
        name: alarm_set_1
      - id: 12
        type: string
        optional: true
        name: alarm_set_2
      - id: 14
        type: string
        optional: true
        name: mode
        mapping:
          - dps_val: charge_now
          - dps_val: charge_pct
          - dps_val: charge_energy
          - dps_val: charge_schedule
      - id: 15
        type: integer
        optional: true
        name: balance_energy
        unit: kWh
      - id: 18
        type: boolean
        optional: true
        name: switch
      - id: 23
        type: string
        optional: true
        name: system_version
      - id: 25
        type: integer
        optional: true
        name: charge_energy_once
        unit: kWh
      - id: 27
        type: string
        optional: true
        name: online_state
      - id: 105
        type: boolean
        optional: true
        name: require_authorization
  - entity: sensor
    name: Charging time
    icon: "mdi:timer-outline"
    class: duration
    category: diagnostic
    dps:
      - id: 121
        name: sensor
        type: integer
        optional: true
        unit: h
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    name: Maximum allowed current
    category: diagnostic
    icon: "mdi:shield-flash"
    dps:
      - id: 113
        name: sensor
        type: string
        optional: true
  - entity: sensor
    name: Alarm event
    icon: "mdi:alert-outline"
    category: diagnostic
    class: enum
    dps:
      - id: 10
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: "Ready"
          - dps_val: 1
            value: "Under voltage protection"
          - dps_val: 2
            value: "Over voltage protection"
          - dps_val: 4
            value: "Over current protection"
          - dps_val: 8
            value: "Protective earth error"
          - dps_val: 16
            value: "Temperature is to high"
          - dps_val: 32
            value: "Control pilot line error"
          - dps_val: 64
            value: "Leak"
          - dps_val: 128
            value: "Relay socket"
          - dps_val: 256
            value: "Protective earth error 2"
          - dps_val: 512
            value: "Plug temperature is to high."
          - dps_val: 1024
            value: "PCB temperature is to high."
          - dps_val: 2048
            value: "Core temperature is to high."
          - dps_val: 4096
            value: "ESB"
          - dps_val: 8192
            value: "Socket protective earth error"
          - dps_val: 16384
            value: "Socket leakage"
          - dps_val: 32768
            value: "Socket temperature is to high."
